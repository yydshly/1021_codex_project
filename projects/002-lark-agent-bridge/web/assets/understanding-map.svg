<text x="878" y="971" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge">Agent 负责实际执行，Bridge 负责连接与运行组织。</text>
<rect x="84" y="1072" width="1340" height="628" rx="20" fill="#ffffff" stroke="#d8e2d4" stroke-width="2"/>
