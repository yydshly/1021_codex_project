<text x="141" y="1262" fill="#1c604b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">01</text>
<text x="210" y="1254" fill="#203d33" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="700" dominant-baseline="text-before-edge">启动执行</text>
