<text x="210" y="1334" fill="#203d33" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="700" dominant-baseline="text-before-edge">传入上下文</text>
<text x="480" y="1336" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="400" dominant-baseline="text-before-edge">写入任务与附件，传递恢复会话标识</text>
<rect x="126" y="1412" width="56" height="44" rx="8" fill="#eaf1e5" stroke="#eaf1e5" stroke-width="2"/>
<text x="141" y="1422" fill="#1c604b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">03</text>
<text x="210" y="1414" fill="#203d33" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="700" dominant-baseline="text-before-edge">统一输出</text>
<text x="480" y="1416" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="400" dominant-baseline="text-before-edge">文本、工具事件、结果、错误与结束状态</text>
<rect x="126" y="1492" width="56" height="44" rx="8" fill="#eaf1e5" stroke="#eaf1e5" stroke-width="2"/>
<text x="141" y="1502" fill="#1c604b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">04</text>
<text x="210" y="1494" fill="#203d33" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="700" dominant-baseline="text-before-edge">控制生命周期</text>
<text x="480" y="1496" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="400" dominant-baseline="text-before-edge">停止执行、等待退出，向上报告状态</text>
<rect x="124" y="1600" width="1260" height="62" rx="10" fill="#eaf1e5" stroke="#eaf1e5" stroke-width="2"/>
<text x="147" y="1617" fill="#1c604b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge">分工边界：优先级、任务依赖与验收，由上层任务系统负责。</text>
<rect x="1456" y="1072" width="1340" height="628" rx="20" fill="#ffffff" stroke="#d8e2d4" stroke-width="2"/>
<text x="1498" y="1117" fill="#1c604b" font-family="Consolas,monospace" font-size="27" font-weight="400" dominant-baseline="text-before-edge">04</text>
<text x="1558" y="1110" fill="#203d33" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="40" font-weight="700" dominant-baseline="text-before-edge">对我们后期的价值</text>
<text x="1498" y="1182" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" dominant-baseline="text-before-edge">从一个聊天入口，走向可复用的执行架构</text>
<rect x="1498" y="1253" width="126" height="46" rx="8" fill="#eaf1e5" stroke="#eaf1e5" stroke-width="2"/>
<text x="1513" y="1263" fill="#1c604b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">直接价值</text>
<text x="1663" y="1261" fill="#203d33" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="700" dominant-baseline="text-before-edge">从聊天发起本机工作，复用项目与工具</text>
<text x="1663" y="1308" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">降低远程操作门槛，把结果带回讨论现场。</text>
<polyline points="1498,1364 2754,1364" fill="none" stroke="#d8e2d4" stroke-width="2" stroke-linejoin="round"/>
