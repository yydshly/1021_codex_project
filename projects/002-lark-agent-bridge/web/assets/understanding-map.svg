<text x="1663" y="1398" fill="#203d33" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="700" dominant-baseline="text-before-edge">两端分别适配，连接更多平台与 Agent</text>
<text x="1663" y="1445" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">逐步复用会话关联、事件展示和运行控制。</text>
<polyline points="1498,1500 2754,1500" fill="none" stroke="#d8e2d4" stroke-width="2" stroke-linejoin="round"/>
<rect x="1498" y="1520" width="126" height="46" rx="8" fill="#faf0df" stroke="#faf0df" stroke-width="2"/>
<text x="1513" y="1530" fill="#a96935" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">未来设计</text>
<text x="1663" y="1527" fill="#a96935" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="700" dominant-baseline="text-before-edge">持久化任务、项目隔离、故障恢复、产物验收</text>
<text x="1663" y="1573" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">这是后续建设方向，不是当前完整实现。</text>
<text x="1498" y="1640" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">扩展需匹配接口能力，不是更换名称即可接入。</text>
<rect x="84" y="1736" width="2712" height="172" rx="20" fill="#1c604b" stroke="#1c604b" stroke-width="2"/>
<text x="136" y="1772" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="43" font-weight="700" dominant-baseline="text-before-edge">飞书提供入口，Bridge 管会话与运行，Agent 执行，验收确认完成。</text>
<text x="138" y="1844" fill="#bed3bb" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="400" dominant-baseline="text-before-edge">消息 ≠ 任务 ≠ 运行；运行结束 ≠ 目标达成。</text>
<text x="88" y="1952" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">研究 002 · 上游 v0.7.1 / 5898681 · 2026-10-20</text>
<text x="2018" y="1954" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">依据：README 与核心源码；未做真实飞书 / Agent 联调</text>
