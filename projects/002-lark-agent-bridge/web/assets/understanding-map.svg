<text x="126" y="1182" fill="#64796b" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" dominant-baseline="text-before-edge">把统一执行请求，转换成具体 Agent 的调用</text>
